services:
  - type: web
    name: qamir-ai
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_URL
        fromDatabase:
          name: qamir-db
          property: connectionString

databases:
  - name: qamir-db
    plan: free
    region: frankfurt
    databaseName: qamir
    user: qamir_user
    postgresMajorVersion: "17"
