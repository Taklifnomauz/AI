<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Is Vibe</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌸 Life Is Vibe</h1>
            <p class="subtitle">Kundalik kayfiyatingizni kuzating</p>
        </div>

        <div class="user-card">
            <div class="avatar" id="userAvatar">👤</div>
            <h2 id="userName">Foydalanuvchi</h2>
            <p id="userStatus">Bugun kayfiyatingiz qanday?</p>
        </div>

        <div class="mood-section">
            <h3>Kayfiyatingizni tanlang</h3>
            <div class="mood-buttons">
                <button class="mood-btn" data-mood="happy">😊 Baxtli</button>
                <button class="mood-btn" data-mood="sad">😔 G'amgin</button>
                <button class="mood-btn" data-mood="energy">⚡ Energik</button>
                <button class="mood-btn" data-mood="relax">😌 Tinch</button>
            </div>
        </div>

        <div class="stats-section">
            <h3>📊 Bugungi statistika</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-number" id="moodCount">0</span>
                    <span class="stat-label">Kayfiyatlar</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="streakCount">0</span>
                    <span class="stat-label">Kunlar davomi</span>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-primary" id="saveMoodBtn">💾 Kayfiyatni saqlash</button>
            <button class="btn-secondary" id="shareBtn">📤 Do'stlarga ulashish</button>
        </div>

        <div class="footer">
            <p>Telegram Mini App v1.0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
